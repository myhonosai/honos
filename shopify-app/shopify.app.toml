# HON OS Shopify app configuration for the Shopify CLI (used only to release the theme app extension).
# client_id is the app's public Client ID. Never put the client secret here. The storefront blocks need no theme scope.
#
# This file MUST mirror the live app's active version exactly (Dev Dashboard, Versions). With Shopify CLI 5.x:
#   - include_config_on_deploy = true sends this file's settings with every version, so a wrong value here would
#     change the live app.
#   - include_config_on_deploy = false is NOT "extension only": the new version is built with no configuration at all,
#     and the deploy summary lists the name, URLs, scopes and webhooks as "(removed)". Never release that.
# So keep it true, run `shopify app config link` first, and read the deploy summary before confirming (see README.md).
client_id = "154b23d02458cd42edb274394640843b"
name = "HON OS"
application_url = "https://app.myhonos.com/staff/billing/shopify"
embedded = false

[access_scopes]
scopes = "read_inventory,read_orders,read_products,write_inventory,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://app.myhonos.com/staff/billing/shopify/return" ]

[webhooks]
api_version = "2026-10"

[build]
include_config_on_deploy = true
