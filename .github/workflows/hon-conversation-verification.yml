name: HON Conversation F3 (synthetic browser)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/web/src/components/hon-command/**'
      - 'apps/web/src/app/staff/hon/**'
      - 'apps/web/src/app/reference/hon-conversation/**'
      - 'apps/web/scripts/hon-conversation-browser.mjs'
      - '.github/workflows/hon-conversation-verification.yml'
permissions:
  contents: read
concurrency:
  group: hon-conversation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/web build
      - name: Prepare isolated browser tools
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          echo "HON_COMMAND_CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_COMMAND_BROWSER_TOOLS=$RUNNER_TEMP/hon-conversation-tools" >> "$GITHUB_ENV"
          echo "HON_COMMAND_BROWSER_RESULTS=$RUNNER_TEMP/hon-conversation-results" >> "$GITHUB_ENV"
          echo "HON_COMMAND_PLAYWRIGHT=$RUNNER_TEMP/hon-conversation-tools/node_modules/playwright-core" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hon-conversation-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3
          touch "$RUNNER_TEMP/hon-conversation-tools/runner.cjs"
      - name: Synthetic preview and production NOT_CONNECTED states, privacy and accessibility
        id: browser
        working-directory: apps/web
        env:
          HON_COMMAND_BROWSER_LOCAL: '1'
          HON_COMMAND_SERVER: start
        run: node scripts/hon-conversation-browser.mjs
      - name: Retain synthetic screenshots and report
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hon-conversation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hon-conversation-results/
          retention-days: 3
          if-no-files-found: warn
      - if: always()
        run: git diff --exit-code
