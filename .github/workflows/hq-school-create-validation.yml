name: HQ school creation integration
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/web/src/app/hq/schools/**'
      - 'apps/web/src/components/hq-onboarding-*'
      - 'apps/web/src/components/hq-school-directory*'
      - 'apps/web/src/components/hq-school-management-copy.ts'
      - 'apps/web/test/hq-onboarding*'
      - 'apps/web/test/hq-school-directory*'
      - 'apps/web/test/hq-school-session-retirement*'
      - 'apps/web/test/hq-school-management-localization*'
      - 'apps/web/scripts/hq-school-create*'
      - 'apps/web/src/app/hq/support/**'
      - 'apps/web/src/components/hq-support/**'
      - 'apps/web/test/hq-support*'
      - 'apps/web/scripts/hq-support-browser.mjs'
      - 'apps/web/src/app/hq/marketing/**'
      - 'apps/web/src/components/hq-marketing/**'
      - 'apps/web/test/hq-marketing*'
      - 'apps/web/scripts/hq-marketing-browser.mjs'
      - '.github/workflows/hq-school-create-validation.yml'
permissions:
  contents: read
concurrency:
  group: hq-school-create-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  checks:
    name: Repository tests, typecheck, build and migrations
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: pnpm db:check
      - run: git diff --exit-code
  database:
    name: Complete disposable PostgreSQL security proofs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build
      - run: sudo systemctl start postgresql.service && pg_isready -h /var/run/postgresql -p 5432
      - run: .github/scripts/run-db-proofs.sh
  connected:
    name: Real signed-session API/database and mounted browser
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HON_API_BASE_URL: 'http://127.0.0.1:3001'
      HON_HQ_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build && pnpm --filter @hon/web build
      - name: Check actual frontend module loading before database setup
        run: node --test apps/web/scripts/hq-school-create-frontend-loader-check.mjs
      - name: Actual frontend transport through signed-session API and disposable PostgreSQL
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          pg_isready -h /var/run/postgresql -p 5432
          fixture_dir=/home/ubuntu/jobs/hq_school_create
          sudo mkdir -p "$fixture_dir"
          sudo chown "$(id -u):$(id -g)" /home/ubuntu /home/ubuntu/jobs "$fixture_dir"
          chmod 700 "$fixture_dir"
          trap 'rm -f "$fixture_dir/fixture.env"' EXIT
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_FLEXIBLE_BILLING_ACCOUNTS_VALIDATION_TARGET=postgresql://localhost:5432/hon_flexible_billing_accounts_validation HON_FLEXIBLE_BILLING_ACCOUNTS_ENV_FILE="$fixture_dir/fixture.env" node packages/database/scripts/setup-flexible-billing-accounts-validation.mjs
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_HQ_CREATE_API_TEST=1 bash -c 'set -a; . "$1"; set +a; node apps/web/scripts/hq-school-create-api-verification.mjs' _ "$fixture_dir/fixture.env"
      - name: Pinned browser tools and Korean font
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          echo "HON_HQ_CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "HON_HQ_BROWSER_TOOLS=$RUNNER_TEMP/hon-hq-create-tools" >> "$GITHUB_ENV"
          echo "HON_HQ_BROWSER_RESULTS=$RUNNER_TEMP/hon-hq-create-results" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hon-hq-create-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3
      - name: Mounted production application with synthetic browser fixtures
        id: browser
        run: pnpm --filter @hon/web exec node scripts/hq-school-create-browser.mjs
      - name: Mounted HQ Support pages with synthetic browser fixtures
        id: support-browser
        run: pnpm --filter @hon/web exec node scripts/hq-support-browser.mjs
      - name: Mounted HQ Marketing & Creative page with synthetic browser fixtures
        id: marketing-browser
        run: pnpm --filter @hon/web exec node scripts/hq-marketing-browser.mjs
      - if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hon-hq-school-create-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hon-hq-create-results/
          retention-days: 3
          if-no-files-found: warn
      - if: always()
        run: git diff --exit-code
