name: CRM trial recovery pinned backend integration
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/web/src/components/crm-journey/**'
      - 'apps/web/test/crm-trial-recovery*'
      - 'apps/web/scripts/crm-trial-recovery*'
      - '.github/workflows/crm-trial-recovery-validation.yml'
permissions:
  contents: read
concurrency:
  group: crm-trial-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
  HON_CRM_TRIAL_RECOVERY_BACKEND_SHA: '9e8289fc0e9485ea8f4cc4b76f3765940c8b7f52'
jobs:
  # connected-crm-validation.yml already checks this frontend head (workspace tests,
  # typecheck, build, migrations and its canonical PostgreSQL suite). Do not duplicate
  # those jobs here. This job verifies the separately pinned, still-proposed backend.
  pinned-backend:
    name: Pinned backend proofs and actual frontend API transport
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      HON_CRM_TRIAL_RECOVERY_FRONTEND_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '9e8289fc0e9485ea8f4cc4b76f3765940c8b7f52'
          path: backend-fixture
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            backend-fixture/pnpm-lock.yaml
      - name: Verify and label both exact source identities
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HON_CRM_TRIAL_RECOVERY_FRONTEND_SHA"
          test "$(git -C backend-fixture rev-parse HEAD)" = "$HON_CRM_TRIAL_RECOVERY_BACKEND_SHA"
          node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
          printf 'Frontend head: `%s`\n\nPinned proposed backend: `%s`\n\nEvidence below is real signed-session API/PostgreSQL, separate from synthetic browser fixtures.\n' "$HON_CRM_TRIAL_RECOVERY_FRONTEND_SHA" "$HON_CRM_TRIAL_RECOVERY_BACKEND_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Build unchanged frontend dependency packages for the actual transport
        run: pnpm install --frozen-lockfile && pnpm prepare:workspace
      - name: Build and test the isolated pinned backend
        working-directory: backend-fixture
        run: |
          pnpm install --frozen-lockfile
          pnpm prepare:workspace
          pnpm --filter @hon/contracts check
          pnpm --filter @hon/domain test
          pnpm --filter @hon/api test
          pnpm db:check
          git diff --exit-code
      - name: Full pinned-backend disposable PostgreSQL suite, including the trial integrity proof
        id: backend-proofs
        working-directory: backend-fixture
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          pg_isready -h /var/run/postgresql -p 5432
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const script=readFileSync('.github/scripts/run-db-proofs.sh','utf8');
          assert(script.includes('proof crm-lead-close test-crm-trial-appointment-integrity.mjs'));
          const calls=script.split('\n').filter(line=>/^proof /.test(line)).length;
          const standalone=script.split('\n').filter(line=>/^passed=\$\(\(passed \+ 1\)\)/.test(line)).length;
          assert.equal(calls+standalone,48);
          console.log('Pinned registry: 48 proof groups; execution follows (registration is not a passing result).');
          NODE
          bash .github/scripts/run-db-proofs.sh
      - name: Actual new frontend trial reads through signed-session Nest and guarded local PostgreSQL
        if: always() && steps.backend-proofs.outcome != 'skipped'
        run: |
          set -euo pipefail
          fixture_dir=/home/ubuntu/jobs/crm_trial_recovery
          sudo mkdir -p "$fixture_dir"
          sudo chown "$(id -u):$(id -g)" /home/ubuntu /home/ubuntu/jobs "$fixture_dir"
          chmod 700 "$fixture_dir"
          trap 'rm -f "$fixture_dir/recovery.env"' EXIT
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_FLEXIBLE_BILLING_ACCOUNTS_VALIDATION_TARGET=postgresql://localhost:5432/hon_flexible_billing_accounts_validation HON_FLEXIBLE_BILLING_ACCOUNTS_ENV_FILE="$fixture_dir/recovery.env" node backend-fixture/packages/database/scripts/setup-flexible-billing-accounts-validation.mjs
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_CRM_TRIAL_RECOVERY_API_TEST=1 HON_CRM_TRIAL_RECOVERY_BACKEND_ROOT="$GITHUB_WORKSPACE/backend-fixture" HON_CRM_TRIAL_RECOVERY_FRONTEND_SHA="$HON_CRM_TRIAL_RECOVERY_FRONTEND_SHA" HON_CRM_TRIAL_RECOVERY_BACKEND_SHA="$HON_CRM_TRIAL_RECOVERY_BACKEND_SHA" bash -c 'set -a; . "$1"; set +a; node apps/web/scripts/crm-trial-recovery-api-verification.mjs' _ "$fixture_dir/recovery.env"
      - name: Both checkouts retain their tracked source
        if: always()
        run: git diff --exit-code && git -C backend-fixture diff --exit-code
