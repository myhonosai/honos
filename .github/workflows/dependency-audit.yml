# Recurring dependency advisory check (GitHub security review 2026-11-22).
# Fails on any High or Critical advisory in the pnpm workspace or either mobile app's npm lockfile.
# Reads lockfiles only: no install scripts run, no secrets, read-only token. Fix by upgrading to a
# compatible patched version or a scoped override; never `audit fix --force`.
name: Dependency audit

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '**/package.json'
      - 'apps/parent-mobile/package-lock.json'
      - 'apps/staff-mobile/package-lock.json'
      - '.github/workflows/dependency-audit.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - 'apps/parent-mobile/package-lock.json'
      - 'apps/staff-mobile/package-lock.json'
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: pnpm workspace (high and critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - run: pnpm audit --audit-level high

  mobile:
    name: ${{ matrix.app }} (high and critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [parent-mobile, staff-mobile]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - working-directory: apps/${{ matrix.app }}
        run: npm audit --package-lock-only --audit-level high
