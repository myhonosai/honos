# Temporary, owner-authorized frontend review only. Remove in a separately reviewed cleanup.
name: School Subscription Browser (temporary)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/school-subscription-verification.yml'
      - 'apps/web/src/components/school-subscription/**'
      - 'apps/web/src/app/staff/subscription/**'
      - 'apps/web/scripts/school-subscription-browser.mjs'
      - 'apps/web/test/school-subscription.test.tsx'
permissions:
  contents: read
concurrency:
  group: school-subscription-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.head_ref == 'codex/school-subscription-foundation' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      HON_SUBSCRIPTION_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install unchanged lockfile and build actual application
        run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/web build
      - name: Focused frontend and session-boundary tests
        run: pnpm --filter @hon/web exec vitest run test/school-subscription.test.tsx test/staff-route-auth-layout.test.ts test/public-plan-catalog.test.ts
      - name: Prepare pinned browser tools outside the repository
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          echo "HON_SUBSCRIPTION_CHROME=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_SUBSCRIPTION_TOOLS=$RUNNER_TEMP/hon-subscription-tools" >> "$GITHUB_ENV"
          echo "HON_SUBSCRIPTION_RESULTS=$RUNNER_TEMP/hon-subscription-results" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hon-subscription-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3
      - name: Actual school page, synthetic signed sessions, no billing services
        id: browser
        run: pnpm --filter @hon/web exec node scripts/school-subscription-browser.mjs
      - name: Upload screenshots and sanitized report
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hon-school-subscription-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hon-subscription-results/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
      - name: Check tracked source unchanged
        if: always()
        run: git diff --exit-code
