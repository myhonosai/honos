name: HQ Pricing & Offers UX Browser
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/web/src/components/hq-modern/pricing-offers*'
      - 'apps/web/src/components/hq-modern/catalog.ts'
      - 'apps/web/src/app/hq/pricing-offers/**'
      - 'apps/web/test/hq-pricing-offers*'
      - 'apps/web/scripts/hq-pricing-offers-browser.mjs'
      - 'packages/design-system/src/localization/**'
      - '.github/workflows/hq-pricing-offers-verification.yml'
permissions:
  contents: read
concurrency:
  group: hq-pricing-ux-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HON_API_BASE_URL: 'http://127.0.0.1:3001'
      HON_HQ_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install unchanged lockfile and build application
        run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/web build
      - name: Pricing presentation and HQ/localization regressions
        run: pnpm --filter @hon/web exec vitest run test/hq-pricing-offers.test.tsx test/hq-pricing-offers-interaction.test.tsx test/hq-modern.test.tsx test/hq-saas-review.test.tsx test/localization.test.tsx
      - name: Diagnose and provision Korean browser fonts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hon-pricing-results"
          fc-list ':lang=ko' family | sort -u > "$RUNNER_TEMP/hon-pricing-results/korean-fonts-before.txt"
          if ! fc-list ':lang=ko' family | grep -q 'Noto Sans CJK KR'; then
            # Scope font provisioning to the official HTTPS Ubuntu archive. Keep package/TLS
            # signature verification; leave the runner's system repository configuration intact.
            font_sources="$RUNNER_TEMP/hon-fonts.list"
            echo 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main' > "$font_sources"
            font_options=(-o "Dir::Etc::sourcelist=$font_sources" -o 'Dir::Etc::sourceparts=-' -o Acquire::Retries=0 -o Acquire::https::Timeout=30)
            timeout 120s sudo apt-get "${font_options[@]}" update
            timeout 120s sudo apt-get "${font_options[@]}" install -y --no-install-recommends fonts-noto-cjk
            timeout 30s fc-cache -f
          fi
          fc-list ':lang=ko' family | sort -u > "$RUNNER_TEMP/hon-pricing-results/korean-fonts-after.txt"
          grep 'Noto Sans CJK KR' "$RUNNER_TEMP/hon-pricing-results/korean-fonts-after.txt"
          dpkg-query -W fonts-noto-cjk > "$RUNNER_TEMP/hon-pricing-results/korean-font-package.txt"
      - name: Prepare pinned browser tools outside the workspace
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          echo "HON_HQ_CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_HQ_BROWSER_TOOLS=$RUNNER_TEMP/hon-pricing-tools" >> "$GITHUB_ENV"
          echo "HON_HQ_BROWSER_RESULTS=$RUNNER_TEMP/hon-pricing-results" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hon-pricing-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3
      - name: Actual authenticated application with isolated synthetic HQ identity
        id: browser
        run: pnpm --filter @hon/web exec node scripts/hq-pricing-offers-browser.mjs
      - name: Retain private screenshots and sanitized browser report
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hon-hq-pricing-ux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hon-pricing-results/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
      - name: Check tracked files unchanged
        if: always()
        run: git diff --exit-code
