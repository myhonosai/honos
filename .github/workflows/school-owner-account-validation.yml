name: School owner account foundation (provider-free)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/scripts/run-db-proofs.sh'
      - 'apps/api/src/foundation/**'
      - 'apps/api/src/observability/**'
      - 'apps/web/src/app/api/client-errors/**'
      - 'apps/web/src/app/global-error.tsx'
      - 'apps/web/src/instrumentation.ts'
      - 'packages/config/src/telemetry-redaction.ts'
      - 'packages/database/src/database-tls.ts'
      - 'packages/database/scripts/migration-*.mjs'
      - 'packages/database/scripts/verify-rls.mjs'
      - 'packages/database/migration-checksums.json'
      - 'apps/api/src/accounts/**'
      - 'apps/api/test/school-owner-invitations.test.cjs'
      - 'apps/web/src/components/owner-invitations/**'
      - 'apps/web/src/app/account/**'
      - 'apps/web/src/app/hq/school-owner-invitations/**'
      - 'apps/web/test/owner-invitations.test.tsx'
      - 'apps/web/src/components/hon-os-start/**'
      - 'apps/web/test/hon-os-start*.test.tsx'
      - 'apps/web/scripts/hon-os-start-browser.mjs'
      - 'apps/web/next.config.ts'
      - 'apps/web/src/server/web-startup.ts'
      - 'apps/web/test/web-startup.test.ts'
      - 'apps/web/scripts/web-startup-verification.mjs'
      - 'packages/auth/**'
      - 'packages/contracts/src/school-owner-invitations.ts'
      - 'packages/database/migrations/0191_*'
      - 'packages/database/scripts/*school*account*'
      - 'packages/database/scripts/test-school-owner-invitations-integrity.mjs'
      - '.github/workflows/school-owner-account-validation.yml'
permissions:
  contents: read
concurrency:
  group: school-owner-account-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: node --test .github/scripts/verify-node-runtime.test.mjs scripts/configure-zernio.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: pnpm db:check
      - run: git diff --exit-code


  database:
    name: Disposable PostgreSQL security proofs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # Full canonical suite includes the exhaustive lock-order audit plus B1.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Require a patched Node.js runtime (October 2026 security release)
        run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - name: Install dependencies (lockfile only)
        run: pnpm install --frozen-lockfile
      - name: Build packages used by the proofs
        run: pnpm prepare:workspace && pnpm --filter @hon/api build
      - name: Start the runner's preinstalled local PostgreSQL (disposable, localhost only)
        run: |
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do pg_isready -h /var/run/postgresql -p 5432 && break; sleep 1; done
          pg_isready -h /var/run/postgresql -p 5432
          sudo -u postgres psql -X -tAc "SELECT version()"
      - name: Run guarded disposable-database proofs
        run: .github/scripts/run-db-proofs.sh

  browser:
    if: github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HON_API_BASE_URL: 'http://127.0.0.1:3001'
      HON_HQ_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install unchanged lockfile and build application
        run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/web build
      - name: Prepare pinned browser tools outside the workspace
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          echo "HON_HQ_CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_HQ_BROWSER_TOOLS=$RUNNER_TEMP/hon-owner-account-tools" >> "$GITHUB_ENV"
          echo "HON_HQ_BROWSER_RESULTS=$RUNNER_TEMP/hon-owner-account-results" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hon-owner-account-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3 esbuild@0.25.12
      - name: Actual application with signed synthetic contract fixtures
        id: browser
        run: pnpm --filter @hon/web exec node scripts/school-owner-invitations-browser.mjs
      - name: Actual application public sign-up and free-trial start with signed synthetic contract fixtures
        run: pnpm --filter @hon/web exec node scripts/hon-os-start-browser.mjs
      - name: Actual built web startup and authentication safety
        run: pnpm --filter @hon/web exec node scripts/web-startup-verification.mjs
      - name: Retain private screenshots and sanitized browser report
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hon-owner-account-privacy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hon-owner-account-results/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
      - name: Check tracked files unchanged
        if: always()
        run: git diff --exit-code
