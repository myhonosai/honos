name: Commercial staging rehearsal (disposable only)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/database/scripts/*commercial-staging*'
      - '.github/workflows/commercial-staging-validation.yml'
      - 'packages/database/migrations/0186_*'
      - 'packages/database/migrations/0187_*'
      - 'packages/database/migrations/0188_*'
      - 'packages/database/migrations/0189_*'
      - 'packages/database/scripts/*subscription-generation*'
      - 'apps/api/src/payments/subscription-schedule-provider.ts'
      - 'apps/api/test/saas-subscription-generation.test.cjs'
      - 'apps/api/test/fixtures/subscription-schedule-provider.cjs'
      - 'packages/contracts/src/saas-subscription-generation.ts'
      - 'packages/database/scripts/*price-acceptance*'
      - 'apps/api/src/saas-pricing/**'
      - 'apps/api/test/saas-price-acceptance.test.cjs'
      - 'packages/contracts/src/saas-price-acceptance.ts'
      - 'packages/database/scripts/*trial-governance*'
      - 'apps/api/src/saas-trials/**'
      - 'apps/api/test/saas-trials.test.cjs'
      - 'packages/contracts/src/saas-trials.ts'
      - 'packages/database/scripts/*exception-policy*'
      - 'packages/contracts/src/saas-introductory-pricing.ts'
      - 'packages/domain/src/saas-introductory-pricing*'
      - 'apps/api/test/saas-introductory-pricing.test.cjs'
permissions:
  contents: read
concurrency:
  group: commercial-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: node --test .github/scripts/verify-node-runtime.test.mjs
      - run: pnpm install --frozen-lockfile
      - name: Guard and migration-checksum regression tests
        run: node --test packages/database/scripts/commercial-staging.test.mjs
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: pnpm db:check
      - run: git diff --exit-code
  rehearsal:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build
      - name: Prepare ephemeral local PostgreSQL and private directories
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          pg_isready -h /var/run/postgresql -p 5432
          sudo mkdir -p /home/ubuntu/jobs
          sudo chown "$(id -u):$(id -g)" /home/ubuntu /home/ubuntu/jobs
          chmod 700 /home/ubuntu/jobs
          mkdir -m 700 "$RUNNER_TEMP/hon-commercial-staging"
      - name: Rehearse migrations and synthetic proofs without provider access
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL+x}"
          test -z "${HON_RUNTIME_DATABASE_URL+x}"
          # Like the existing database-proof workflow, pass only fixed local prerequisites.
          # Parent CI metadata/credentials/preloads never enter the rehearsal process.
          env -i "PATH=$PATH" "HOME=$HOME" LANG=C.UTF-8 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            node packages/database/scripts/run-commercial-staging-validation.mjs --confirm-disposable-local --report "$RUNNER_TEMP/hon-commercial-staging/report.json"
      - name: Show sanitized failure summary
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'hon-commercial-staging/report.json'
          if report.exists():
              data = json.loads(report.read_text())
              print(data.get('failure', 'No failure detail recorded'))
          PYTHON
      - name: Retain sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hon-commercial-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hon-commercial-staging/report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Check tracked source unchanged
        if: always()
        run: git diff --exit-code

  regressions:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build
      - run: sudo systemctl start postgresql.service && pg_isready -h /var/run/postgresql -p 5432
      - name: Existing guarded full PostgreSQL regressions (ephemeral only)
        run: .github/scripts/run-db-proofs.sh
