name: HQ access-exception frontend validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/web/src/components/hq-access-exceptions/**'
      - 'apps/web/src/app/hq/access-exceptions/**'
      - 'apps/web/src/app/hq/revenue/page.tsx'
      - 'apps/web/test/hq-access-exceptions*'
      - 'apps/web/scripts/hq-access-exceptions*'
      - 'apps/web/scripts/fixtures/hq-access-exceptions*'
      - '.github/workflows/hq-access-exceptions-validation.yml'
permissions:
  contents: read
concurrency:
  group: hq-access-exceptions-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: pnpm db:check
      - run: git diff --exit-code
  database:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build
      - name: Complete canonical disposable PostgreSQL security proofs
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo systemctl start postgresql.service
          pg_isready -h /var/run/postgresql -p 5432
          bash .github/scripts/run-db-proofs.sh
      - if: always()
        run: git diff --exit-code
  api-database:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HON_HQ_EXCEPTION_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build
      - name: Actual frontend transport, signed HQ sessions and marked disposable PostgreSQL
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$HON_HQ_EXCEPTION_SOURCE_SHA"
          test -z "${DATABASE_URL:-}"
          test -z "${HON_RUNTIME_DATABASE_URL:-}"
          sudo systemctl start postgresql.service
          pg_isready -h /var/run/postgresql -p 5432
          fixture_dir=/home/ubuntu/jobs/hq_access_exceptions
          sudo mkdir -p "$fixture_dir"
          sudo chown "$(id -u):$(id -g)" /home/ubuntu /home/ubuntu/jobs "$fixture_dir"
          chmod 700 "$fixture_dir"
          test ! -e "$fixture_dir/fixture.env"
          trap 'rm -f "$fixture_dir/fixture.env"' EXIT
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_CHAMPIONS_VALIDATION_TARGET=postgresql://localhost:5432/hon_champions_validation HON_CHAMPIONS_ENV_FILE="$fixture_dir/fixture.env" node packages/database/scripts/setup-champions-club-validation.mjs
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_HQ_EXCEPTION_API_TEST=1 HON_HQ_EXCEPTION_SOURCE_SHA="$HON_HQ_EXCEPTION_SOURCE_SHA" bash -c 'set -a; . "$1"; set +a; node apps/web/scripts/hq-access-exceptions-api-verification.mjs' _ "$fixture_dir/fixture.env"
      - if: always()
        run: git diff --exit-code
  browser:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HON_API_BASE_URL: 'http://127.0.0.1:3001'
      HON_HQ_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/web build
      - name: Isolated browser tools and Korean fonts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          echo "HON_HQ_CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_HQ_BROWSER_TOOLS=$RUNNER_TEMP/hq-exception-tools" >> "$GITHUB_ENV"
          echo "HON_HQ_BROWSER_RESULTS=$RUNNER_TEMP/hq-exception-results" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hq-exception-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3
      - name: Actual application with signed synthetic contract fixtures
        id: browser
        run: pnpm --filter @hon/web exec node scripts/hq-access-exceptions-browser.mjs
      - name: Private synthetic screenshot and accessibility evidence
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hon-hq-access-exceptions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hq-exception-results/
          retention-days: 3
          if-no-files-found: warn
      - if: always()
        run: git diff --exit-code
