# HON OS database migrations (manual, owner-run).
#
# The ONLY way this workflow runs is a person pressing "Run workflow" on main. It never runs on pull
# requests, pushes or a schedule. It applies the repository's migrations to the Supabase database of
# the chosen GitHub environment, using that environment's secrets:
#   DATABASE_URL          migration role (postgres.<ref>) via the Session Pooler, port 5432, no sslmode
#   HON_DATABASE_CA_CERT  PEM text of the Supabase project CA
# Create the environments in Settings > Environments. On BOTH staging and production set
# "Deployment branches" to the main branch only and add David as a Required reviewer: without a
# branch policy, a workflow on any pushed branch could request the environment and read its secrets.
# Runbook: docs/operations/RENDER_DEPLOYMENT.md and docs/operations/BACKUP_RESTORE_AND_RECOVERY.md.
# Guarded by .github/scripts/database-migrate-workflow.test.mjs.
name: Database migrate (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which database (GitHub environment)
        type: choice
        options: [staging, production]
        required: true
      action:
        description: "status = read-only check; migrate = apply pending migrations; verify = read-only security verifier"
        type: choice
        options: [status, migrate, verify]
        default: status
        required: true
      confirm:
        description: "For migrate only: type the target name again (staging or production)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # One run per database at a time; never cancel a run that may be mid-migration.
  group: database-migrate-${{ inputs.target }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  database:
    name: ${{ inputs.action }} ${{ inputs.target }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    steps:
      - name: Refuse migrate without matching confirmation
        if: inputs.action == 'migrate' && inputs.confirm != inputs.target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          echo "::error::To migrate, type the target name ($TARGET) in the confirm box."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: Verify patched Node.js runtime
        run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4

      # Everything is installed and compiled HERE, before any secret is in the environment. The
      # credential steps below only run the already-built scripts with plain node: no install, no
      # tsc, no package-script indirection while DATABASE_URL is present.
      - name: Install and build the database package
        run: |
          pnpm install --frozen-lockfile
          pnpm prepare:workspace
          test -f packages/database/dist/index.js

      - name: Migration files match the recorded checksums
        run: pnpm db:check

      - name: Status before (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HON_DATABASE_CA_CERT: ${{ secrets.HON_DATABASE_CA_CERT }}
        run: node packages/database/scripts/migration-status.mjs

      - name: Apply pending migrations
        if: inputs.action == 'migrate'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HON_DATABASE_CA_CERT: ${{ secrets.HON_DATABASE_CA_CERT }}
        run: node packages/database/scripts/migrate.mjs

      - name: Status after (must be current)
        if: inputs.action == 'migrate'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HON_DATABASE_CA_CERT: ${{ secrets.HON_DATABASE_CA_CERT }}
        run: node packages/database/scripts/migration-status.mjs --require-current

      - name: Security verifier (forced RLS, least privilege)
        if: inputs.action == 'verify'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HON_DATABASE_CA_CERT: ${{ secrets.HON_DATABASE_CA_CERT }}
        run: node packages/database/scripts/verify-rls.mjs
