# HON Parent mobile app (apps/parent-mobile). The app has its own npm lockfile and sits outside the pnpm
# workspace, so the main CI never installs React Native. This job runs its tests, typecheck and a JS bundle
# for iOS and Android. No secrets, no EAS, no store builds or submissions.
name: Parent mobile app
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/parent-mobile/**
      - packages/contracts/src/**
      - .github/workflows/parent-mobile.yml
  push:
    branches: [main]
    paths:
      - apps/parent-mobile/**
      - packages/contracts/src/**
      - .github/workflows/parent-mobile.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parent-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mobile:
    name: Parent app tests, typecheck and bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/parent-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: apps/parent-mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --ci
      - run: npm run check
      - name: Bundle iOS and Android JavaScript (no native build)
        run: npm run bundle:check
        env:
          EXPO_PUBLIC_HON_API_URL: https://api.example.invalid
