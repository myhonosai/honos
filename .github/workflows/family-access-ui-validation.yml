name: Family account frontend integration
on:
  pull_request:
    branches: [main, claude/parent-invitations]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - apps/web/src/components/family-access/**
      - apps/web/src/app/staff/family-access/**
      - apps/web/src/app/account/family-invitation/**
      - apps/web/test/family-access-*.test.*
      - apps/web/scripts/family-access-integration.mjs
      - apps/web/public/manus-routes.json
      - .github/workflows/family-access-ui-validation.yml
permissions:
  contents: read
concurrency:
  group: family-account-frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Family frontend tests, typecheck, build and migration validation
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'claude/parent-invitations')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
      HON_API_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace
      - run: pnpm --filter @hon/web test && pnpm --filter @hon/web check && pnpm --filter @hon/web build
      - run: node packages/database/scripts/verify-migrations.mjs && git diff --exit-code
  real-integration:
    name: Actual family frontend, signed-session API, disposable PostgreSQL and browser
    if: github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'claude/parent-invitations')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      HON_API_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build && pnpm --filter @hon/web build
      - name: Prepare pinned browser tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          echo "HON_FAMILY_ACCESS_CHROME=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_FAMILY_ACCESS_TOOLS=$RUNNER_TEMP/family-access-tools" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/family-access-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3
      - name: Real API, canonical fixture and mounted browser verification
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          pg_isready -h /var/run/postgresql -p 5432
          fixture_dir=/home/ubuntu/jobs/family_frontend_validation
          sudo mkdir -p "$fixture_dir"
          sudo chown "$(id -u):$(id -g)" /home/ubuntu /home/ubuntu/jobs "$fixture_dir"
          chmod 700 "$fixture_dir"
          trap 'rm -f "$fixture_dir/fixture.env"' EXIT
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_CHAMPIONS_VALIDATION_TARGET=postgresql://localhost:5432/hon_champions_validation HON_CHAMPIONS_ENV_FILE="$fixture_dir/fixture.env" node packages/database/scripts/setup-champions-club-validation.mjs
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 bash -c 'set -a; . "$1"; set +a; node packages/database/scripts/test-school-family-access-invitations-integrity.mjs' _ "$fixture_dir/fixture.env"
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted HON_FAMILY_ACCESS_TEST=1 HON_FAMILY_ACCESS_SHA="$SOURCE_SHA" HON_FAMILY_ACCESS_TOOLS="$HON_FAMILY_ACCESS_TOOLS" HON_FAMILY_ACCESS_CHROME="$HON_FAMILY_ACCESS_CHROME" HON_FAMILY_ACCESS_RESULTS="$RUNNER_TEMP/family-access-results" bash -c 'set -a; . "$1"; set +a; node apps/web/scripts/family-access-integration.mjs' _ "$fixture_dir/fixture.env"
      - name: Retain private browser and integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: family-access-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/family-access-results/
          retention-days: 3
          if-no-files-found: warn
      - run: git diff --exit-code
