name: Class Sessions Native Browser
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/api/src/schedule/class-session*'
      - 'apps/api/src/schedule/same-origin-proxy.ts'
      - 'apps/api/src/foundation/hon-identity*'
      - 'apps/web/next.config.*'
      - 'apps/web/src/middleware.ts'
      - 'apps/web/src/components/class-session*'
      - 'packages/auth/src/**'
      - 'packages/database/scripts/test-class-sessions-native-browser.mjs'
      - 'packages/database/scripts/setup-class-sessions-read-validation.mjs'
      - 'packages/database/scripts/class-sessions-read-*'
      - '.github/workflows/class-sessions-browser-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: class-sessions-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || (github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HON_API_BASE_URL: 'http://127.0.0.1:3001'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Require a patched Node.js runtime (October 2026 security release)
        run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - name: Install unchanged lockfile and build API and production web
        run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build && pnpm --filter @hon/web build
      - name: Prepare pinned browser tools outside the repository
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          echo "HON_BROWSER_CHROME=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_BROWSER_TOOLS=$RUNNER_TEMP/hon-browser-tools" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hon-browser-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Native Chromium -> production Next -> Nest -> guarded disposable PostgreSQL
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do pg_isready -h /var/run/postgresql -p 5432 && break; sleep 1; done
          pg_isready -h /var/run/postgresql -p 5432
          fixture_dir=/home/ubuntu/jobs/class_sessions_browser
          sudo mkdir -p "$fixture_dir"
          sudo chown "$(id -u):$(id -g)" /home/ubuntu /home/ubuntu/jobs "$fixture_dir"
          chmod 700 "$fixture_dir"
          trap 'rm -f "$fixture_dir/class-sessions-read.env"' EXIT
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_CLASS_SESSIONS_READ_VALIDATION_TARGET=postgresql://localhost:5432/hon_class_sessions_read_validation HON_CLASS_SESSIONS_READ_ENV_FILE="$fixture_dir/class-sessions-read.env" node packages/database/scripts/setup-class-sessions-read-validation.mjs
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_BROWSER_CHROME="$HON_BROWSER_CHROME" HON_BROWSER_TOOLS="$HON_BROWSER_TOOLS" bash -c 'set -a; . "$1"; set +a; cd packages/database && node scripts/test-class-sessions-native-browser.mjs' _ "$fixture_dir/class-sessions-read.env"
      - name: Check tracked source unchanged
        if: always()
        run: git diff --exit-code
