# Temporary, owner-authorized HON HQ visual verification. Remove after visual sign-off.
# No deployment, secrets, production data, pull_request_target or write permissions.
name: HQ Browser Verification (temporary)

on:
  pull_request:
    branches: [main, codex/hq-modern-implementation]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/hq-browser-verification.yml'
      - 'apps/web/scripts/hq-browser-verification.mjs'
      - 'apps/web/scripts/fixtures/hq-champions-leaderboard.mjs'
      - 'apps/web/test/hq-champions-leaderboard.test.tsx'
      - 'apps/web/src/components/hq-modern/**'
      - 'apps/web/src/app/hq/**'
      - 'apps/web/public/hq-assets/**'

permissions:
  contents: read

concurrency:
  group: hq-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.head_ref == 'codex/hq-modern-implementation' && github.base_ref == 'main') ||
       (github.head_ref == 'codex/hq-champions-integration' && github.base_ref == 'codex/hq-modern-implementation'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      HON_API_BASE_URL: 'http://127.0.0.1:3001'
      HON_HQ_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install the unchanged repository lockfile
        run: pnpm install --frozen-lockfile
      - name: Build existing workspace packages and web application
        run: pnpm prepare:workspace && pnpm --filter @hon/web build
      - name: Prepare pinned temporary browser tools (no repository changes)
        shell: bash
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin" || { echo 'Hosted runner Chrome is unavailable; no download fallback attempted.'; exit 1; }
          echo "HON_HQ_CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_HQ_BROWSER_TOOLS=$RUNNER_TEMP/hon-hq-browser-tools" >> "$GITHUB_ENV"
          echo "HON_HQ_BROWSER_RESULTS=$RUNNER_TEMP/hon-hq-browser-results" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hon-hq-browser-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3
      - name: Verify actual production UI with synthetic localhost fixtures
        id: browser
        run: pnpm --filter @hon/web exec node scripts/hq-browser-verification.mjs
      - name: Upload only screenshots and sanitized report
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hon-hq-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hon-hq-browser-results/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
      - name: Ensure verification did not change tracked source
        if: always()
        run: git diff --exit-code

  integration-ci:
    name: Integration CI — tests, typecheck, build, migrations
    if: github.head_ref == 'codex/hq-champions-integration' && github.base_ref == 'codex/hq-modern-implementation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Run the existing repository CI commands on the stacked branch
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm check
          pnpm build
          pnpm db:check
          git diff --exit-code

  integration-database:
    name: Integration CI — disposable PostgreSQL security proofs
    if: github.head_ref == 'codex/hq-champions-integration' && github.base_ref == 'codex/hq-modern-implementation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build the existing database proof dependencies
        run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build
      - name: Start disposable runner-local PostgreSQL and run existing proofs
        run: |
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do pg_isready -h /var/run/postgresql -p 5432 && break; sleep 1; done
          pg_isready -h /var/run/postgresql -p 5432
          .github/scripts/run-db-proofs.sh
