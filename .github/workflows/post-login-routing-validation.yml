name: Verified post-login routing (isolated web)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/web/src/app/auth/**'
      - 'apps/web/src/server/post-login-routing.ts'
      - 'apps/web/src/server/auth-http.ts'
      - 'apps/web/src/server/require-web-session.ts'
      - 'apps/web/test/auth-routes.test.ts'
      - 'apps/web/test/post-login-*.test.*'
      - 'apps/web/scripts/post-login-routing-http.mjs'
      - 'apps/web/public/manus-routes.json'
      - 'packages/auth/**'
      - '.github/workflows/post-login-routing-validation.yml'
permissions:
  contents: read
concurrency:
  group: post-login-routing-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
      HON_POST_LOGIN_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:workspace
      - name: Focused callback, verified routing and neutral-page tests
        run: pnpm --filter @hon/web exec vitest run test/auth-routes.test.ts test/post-login-routing.test.ts test/post-login-access-page.test.tsx
      - run: pnpm --filter @hon/web check
      - run: pnpm --filter @hon/web build
      - name: Prepare isolated browser tools
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          echo "HON_POST_LOGIN_CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_POST_LOGIN_BROWSER_TOOLS=$RUNNER_TEMP/hon-post-login-tools" >> "$GITHUB_ENV"
          echo "HON_POST_LOGIN_BROWSER_RESULTS=$RUNNER_TEMP/hon-post-login-results" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hon-post-login-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3
      - name: Mounted production routing and neutral-page browser proof (synthetic APIs)
        id: mounted
        run: pnpm --filter @hon/web exec node scripts/post-login-routing-http.mjs
      - name: Retain private synthetic screenshots and report
        if: always() && steps.mounted.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hon-post-login-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hon-post-login-results/
          retention-days: 3
          if-no-files-found: warn
      - run: git diff --exit-code
