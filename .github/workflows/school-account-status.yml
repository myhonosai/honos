name: Read-only school account and usage verification
on:
  pull_request:
    branches: [main, codex/sprint3-owner-experience-integration]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/web/src/app/staff/account-status/**'
      - 'apps/web/src/components/account-status/**'
      - 'apps/web/src/components/operational-navigation.ts'
      - 'apps/web/src/components/school-entry/**'
      - 'apps/web/test/account-status*'
      - 'apps/web/test/operational-navigation*'
      - 'apps/web/scripts/account-status*'
      - 'apps/web/scripts/test-account-status*'
      - '.github/workflows/school-account-status.yml'
permissions:
  contents: read
concurrency:
  group: school-account-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  repository:
    name: Repository tests, typecheck, build and migration validation
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --test apps/web/scripts/test-account-status-verification-support.mjs
      - run: pnpm check
      - run: pnpm build
      - run: pnpm db:check
      - run: git diff --exit-code
  signed-native:
    name: Signed-session account API, disposable PostgreSQL and mounted browser
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HON_API_BASE_URL: 'http://127.0.0.1:3001'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build && pnpm --filter @hon/web build
      - name: Start only the disposable runner PostgreSQL service
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          pg_isready -h /var/run/postgresql -p 5432
          sudo mkdir -p /home/ubuntu/jobs/account_status_verification
          sudo chown "$(id -u):$(id -g)" /home/ubuntu /home/ubuntu/jobs /home/ubuntu/jobs/account_status_verification
          chmod 700 /home/ubuntu/jobs/account_status_verification
      - name: Prepare pinned browser tools without repository dependency changes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          echo "HON_ACCOUNT_STATUS_CHROME=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_ACCOUNT_STATUS_TOOLS=$RUNNER_TEMP/hon-account-status-tools" >> "$GITHUB_ENV"
          echo "HON_ACCOUNT_STATUS_RESULTS=$RUNNER_TEMP/hon-account-status-results" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hon-account-status-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3 esbuild@0.25.12
      - name: Actual read-only frontend with signed identities and canonical database authority
        run: |
          set -euo pipefail
          fixture_dir=/home/ubuntu/jobs/account_status_verification
          trap 'rm -f "$fixture_dir/account-status.env"' EXIT
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_CHAMPIONS_VALIDATION_TARGET=postgresql://localhost:5432/hon_champions_validation HON_CHAMPIONS_ENV_FILE="$fixture_dir/account-status.env" node packages/database/scripts/setup-champions-club-validation.mjs
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted HON_ACCOUNT_STATUS_TEST=1 HON_ACCOUNT_STATUS_SHA="${{ github.event.pull_request.head.sha }}" HON_ACCOUNT_STATUS_CHROME="$HON_ACCOUNT_STATUS_CHROME" HON_ACCOUNT_STATUS_TOOLS="$HON_ACCOUNT_STATUS_TOOLS" HON_ACCOUNT_STATUS_RESULTS="$HON_ACCOUNT_STATUS_RESULTS" HON_CHAMPIONS_ENV_FILE="$fixture_dir/account-status.env" bash -c 'set -a; . "$1"; set +a; node apps/web/scripts/account-status-api-browser-verification.mjs' _ "$fixture_dir/account-status.env"
      - name: Preserve private synthetic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: school-account-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hon-account-status-results/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
      - name: Confirm tracked source unchanged
        if: always()
        run: git diff --exit-code
