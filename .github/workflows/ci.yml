# HON OS continuous integration.
# Runs on pull requests to main and on manual dispatch only: no schedule, no deployment, no secrets.
# Pushes directly to main are intentionally NOT a trigger until the owner approves the expected
# Actions minutes (see docs/CI.md).
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    # Everything except docs, re-including every glob or markdown path that a gated feature workflow triggers on (kept in step by
    # .github/scripts/ci-trigger-matrix.test.mjs): those workflows skip
    # their duplicate full suites for ready PRs to main because CI runs them (see docs/CI.md, duplicate suite gating).
    paths:
      - '**'
      - '.github/**'
      - '!docs/**'
      - '!**/*.md'
      - 'apps/web/**'
      - 'docs/architecture/CRM_LEAD_MEMBERSHIP_RECOVERY_FRONTEND.md'
      - 'apps/web/src/components/membership-dates-*'
      - 'apps/web/src/app/staff/billing/membership-dates/**'
      - 'apps/web/test/membership-dates-*'
      - 'apps/web/scripts/membership-dates-*'
      - 'apps/web/src/app/hq/schools/**'
      - 'apps/web/src/components/hq-onboarding-*'
      - 'apps/web/src/components/hq-school-directory*'
      - 'apps/web/test/hq-onboarding*'
      - 'apps/web/test/hq-school-directory*'
      - 'apps/web/test/hq-school-session-retirement*'
      - 'apps/web/test/hq-school-management-localization*'
      - 'apps/web/scripts/hq-school-create*'
      - 'packages/database/scripts/migration-*.mjs'
      - 'apps/api/src/foundation/runtime-*.ts'
      - 'packages/database/scripts/*commercial-staging*'
      - 'packages/database/migrations/0186_*'
      - 'packages/database/migrations/0187_*'
      - 'packages/database/migrations/0188_*'
      - 'packages/database/migrations/0189_*'
      - 'packages/database/scripts/*subscription-generation*'
      - 'packages/database/scripts/*price-acceptance*'
      - 'apps/api/src/saas-pricing/**'
      - 'packages/database/scripts/*trial-governance*'
      - 'apps/api/src/saas-trials/**'
      - 'packages/database/scripts/*exception-policy*'
      - 'packages/domain/src/saas-introductory-pricing*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  verify:
    name: Test, typecheck, build, migrations
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Require a patched Node.js runtime (October 2026 security release)
        run: |
          node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
          node --test .github/scripts/verify-node-runtime.test.mjs
      - name: Install dependencies (lockfile only)
        run: pnpm install --frozen-lockfile
      - name: Duplicate suite gating keeps every trigger covered
        run: node --test .github/scripts/ci-trigger-matrix.test.mjs
      - name: pnpm test
        run: pnpm test
      - name: pnpm check
        run: pnpm check
      - name: pnpm build
        run: pnpm build
      - name: pnpm db:check (migration file contract)
        run: pnpm db:check
      - name: Verify the build left tracked files unchanged
        run: git diff --exit-code

  database:
    name: Disposable PostgreSQL security proofs
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # Full canonical suite includes the exhaustive lock-order audit plus B1.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Require a patched Node.js runtime (October 2026 security release)
        run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - name: Install dependencies (lockfile only)
        run: pnpm install --frozen-lockfile
      - name: Build packages used by the proofs
        run: pnpm prepare:workspace && pnpm --filter @hon/api build
      - name: Start the runner's preinstalled local PostgreSQL (disposable, localhost only)
        run: |
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do pg_isready -h /var/run/postgresql -p 5432 && break; sleep 1; done
          pg_isready -h /var/run/postgresql -p 5432
          sudo -u postgres psql -X -tAc "SELECT version()"
      - name: Run guarded disposable-database proofs
        run: .github/scripts/run-db-proofs.sh
