# HON OS continuous integration.
# Runs on pull requests to main, on every push to main (merged PRs) and on manual dispatch:
# no schedule, no deployment, no secrets. Push-to-main runs prove the accepted main itself, not just
# each PR's test merge; a newer push to main cancels the older run (see docs/CI.md for minutes).
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  verify:
    name: Test, typecheck, build, migrations
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Require a patched Node.js runtime (October 2026 security release)
        run: |
          node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
          node --test .github/scripts/verify-node-runtime.test.mjs
          node --test .github/scripts/ci-triggers.test.mjs
      - name: Install dependencies (lockfile only)
        run: pnpm install --frozen-lockfile
      - name: pnpm test
        run: pnpm test
      - name: pnpm check
        run: pnpm check
      - name: pnpm build
        run: pnpm build
      - name: pnpm db:check (migration file contract)
        run: pnpm db:check
      - name: Verify the build left tracked files unchanged
        run: git diff --exit-code

  database:
    name: Disposable PostgreSQL security proofs
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # Full canonical suite includes the exhaustive lock-order audit plus B1.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Require a patched Node.js runtime (October 2026 security release)
        run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - name: Install dependencies (lockfile only)
        run: pnpm install --frozen-lockfile
      - name: Build packages used by the proofs
        run: pnpm prepare:workspace && pnpm --filter @hon/api build
      - name: Start the runner's preinstalled local PostgreSQL (disposable, localhost only)
        run: |
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do pg_isready -h /var/run/postgresql -p 5432 && break; sleep 1; done
          pg_isready -h /var/run/postgresql -p 5432
          sudo -u postgres psql -X -tAc "SELECT version()"
      - name: Run guarded disposable-database proofs
        run: .github/scripts/run-db-proofs.sh
