name: Connected student booking and attendance
on:
  pull_request:
    branches: [main, codex/active-membership-recovery, codex/connected-booking-attendance, codex/membership-operations-integrated]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/web/**'
      - 'docs/architecture/CRM_LEAD_MEMBERSHIP_RECOVERY_FRONTEND.md'
      - '.github/workflows/connected-student-operations-validation.yml'
permissions:
  contents: read
concurrency:
  group: connected-student-operations-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  checks:
    name: Repository tests, typecheck, build and migrations
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: pnpm db:check
      - run: git diff --exit-code
  database:
    name: Complete disposable PostgreSQL security proofs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build
      - run: sudo systemctl start postgresql.service && pg_isready -h /var/run/postgresql -p 5432
      - run: .github/scripts/run-db-proofs.sh
  commercial:
    name: Guarded commercial regression rehearsal
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build
      - name: Prepare only the disposable runner database
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          pg_isready -h /var/run/postgresql -p 5432
          sudo mkdir -p /home/ubuntu/jobs
          sudo chown "$(id -u):$(id -g)" /home/ubuntu /home/ubuntu/jobs
          chmod 700 /home/ubuntu/jobs
          mkdir -m 700 "$RUNNER_TEMP/hon-dates-commercial"
      - name: Existing commercial rehearsal without provider access or inherited secrets
        run: |
          set -euo pipefail
          env -i "PATH=$PATH" "HOME=$HOME" LANG=C.UTF-8 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            node packages/database/scripts/run-commercial-staging-validation.mjs --confirm-disposable-local --report "$RUNNER_TEMP/hon-dates-commercial/report.json"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hon-membership-dates-commercial-${{ github.run_id }}
          path: ${{ runner.temp }}/hon-dates-commercial/report.json
          retention-days: 7
          if-no-files-found: warn
      - if: always()
        run: git diff --exit-code

  browser:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HON_API_BASE_URL: 'http://127.0.0.1:3001'
      HON_CRM_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      HON_SCHOOL_MEMBERSHIP_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Require a patched Node.js runtime (October 2026 security release)
        run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - name: Install unchanged lockfile and build application
        run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/web build
      - name: Focused frontend integration tests
        # New date-management tests use the exact shared 0178 contracts; existing regressions remain below.
        run: pnpm --filter @hon/web exec vitest run test/crm-lead-memberships-http.test.ts test/crm-lead-memberships-interaction.test.tsx test/crm-lead-memberships-page-session.test.tsx test/membership-dates-copy.test.tsx test/membership-dates-http.test.ts test/membership-dates-interaction.test.tsx test/membership-dates-page-session.test.tsx
      - name: Owner entry, canonical school selection, session concealment and post-login regressions
        run: pnpm --filter @hon/web exec vitest run test/auth-routes.test.ts test/post-login-routing.test.ts test/post-login-access-page.test.tsx test/school-entry-controller.test.ts test/school-entry-http.test.ts test/school-entry-presentation.test.tsx
      - name: Socket-free canonical-runtime fixture safety
        run: node --test apps/web/scripts/test-owner-entry-canonical-fixture.mjs
      - name: Connected booking, attendance and handoff regressions
        run: pnpm --filter @hon/web exec vitest run test/connected-student-operations.test.tsx test/connected-student-operations-http.test.ts test/crm-lead-memberships-interaction.test.tsx
      - name: Existing CRM and E1a frontend regressions
        run: pnpm --filter @hon/web exec vitest run test/crm-membership-journey.test.tsx test/membership-activation-catalog.test.ts test/membership-activation-ui.test.tsx test/membership-activation-interaction.test.tsx test/membership-activation-page-session.test.tsx test/crm-leads-page-session.test.tsx test/crm-enrollment-discard.test.tsx test/crm-lead-create-ui.test.tsx test/crm-lead-close-ui.test.tsx test/crm-close-privacy.test.tsx test/crm-lead-close-http.test.ts test/crm-enrollment-privacy.test.ts test/crm-family-http.test.ts test/crm-family-flow.test.tsx test/membership-plan-http.test.ts test/membership-plan-ui.test.tsx test/crm-adult-flow-http.test.ts test/crm-adult-flow-ui.test.tsx test/crm-adult-flow-recovery.test.tsx test/crm-leads-workbench.test.tsx test/crm-lifecycle-handoff.test.tsx test/staff-route-auth-layout.test.ts
      - name: Frontend transport against the real API and guarded disposable PostgreSQL
        run: |
          set -euo pipefail
          pnpm --filter @hon/api build
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do pg_isready -h /var/run/postgresql -p 5432 && break; sleep 1; done
          pg_isready -h /var/run/postgresql -p 5432
          fixture_dir=/home/ubuntu/jobs/crm_resume_verification
          sudo mkdir -p "$fixture_dir"
          sudo chown "$(id -u):$(id -g)" /home/ubuntu /home/ubuntu/jobs "$fixture_dir"
          chmod 700 "$fixture_dir"
          trap 'rm -f "$fixture_dir/recovery.env"' EXIT
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_FLEXIBLE_BILLING_ACCOUNTS_VALIDATION_TARGET=postgresql://localhost:5432/hon_flexible_billing_accounts_validation HON_FLEXIBLE_BILLING_ACCOUNTS_ENV_FILE="$fixture_dir/recovery.env" node packages/database/scripts/setup-flexible-billing-accounts-validation.mjs
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_CRM_API_TEST=1 bash -c 'set -a; . "$1"; set +a; node apps/web/scripts/crm-recovery-api-verification.mjs && node apps/web/scripts/crm-family-api-verification.mjs && node apps/web/scripts/membership-activation-api-verification.mjs && node apps/web/scripts/membership-dates-api-verification.mjs' _ "$fixture_dir/recovery.env"
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_SCHOOL_MEMBERSHIP_API_TEST=1 HON_SCHOOL_MEMBERSHIP_SHA="$HON_SCHOOL_MEMBERSHIP_SHA" bash -c 'set -a; . "$1"; set +a; node apps/web/scripts/school-membership-integration-api-verification.mjs' _ "$fixture_dir/recovery.env"
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_CONNECTED_OPERATIONS_API_TEST=1 HON_CONNECTED_OPERATIONS_SHA="$HON_CRM_SOURCE_SHA" bash -c 'set -a; . "$1"; set +a; node apps/web/scripts/connected-student-operations-api-verification.mjs' _ "$fixture_dir/recovery.env"
      - name: Prepare pinned browser tools outside the repository
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          echo "HON_CRM_CHROME=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_CRM_TOOLS=$RUNNER_TEMP/hon-crm-tools" >> "$GITHUB_ENV"
          echo "HON_CRM_RESULTS=$RUNNER_TEMP/hon-crm-results" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hon-crm-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3
      - name: Owner entry against actual Next, signed sessions, canonical API and disposable PostgreSQL
        id: owner_entry
        run: |
          set -euo pipefail
          fixture_dir=/home/ubuntu/jobs/crm_resume_verification
          trap 'rm -f "$fixture_dir/recovery.env"' EXIT
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_FLEXIBLE_BILLING_ACCOUNTS_VALIDATION_TARGET=postgresql://localhost:5432/hon_flexible_billing_accounts_validation HON_FLEXIBLE_BILLING_ACCOUNTS_ENV_FILE="$fixture_dir/recovery.env" node packages/database/scripts/setup-flexible-billing-accounts-validation.mjs
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted HON_OWNER_ENTRY_API_TEST=1 HON_OWNER_ENTRY_SHA="$HON_CRM_SOURCE_SHA" HON_OWNER_ENTRY_TOOLS="$HON_CRM_TOOLS" HON_OWNER_ENTRY_CHROME="$HON_CRM_CHROME" HON_OWNER_ENTRY_RESULTS="$HON_CRM_RESULTS/owner-entry" bash -c 'set -a; . "$1"; set +a; node apps/web/scripts/owner-entry-api-browser-verification.mjs' _ "$fixture_dir/recovery.env"
      - name: Actual application browser verification
        id: browser
        run: pnpm --filter @hon/web exec node scripts/crm-adult-flow-browser.mjs
      - name: Retain private review artifacts
        if: always() && (steps.browser.outcome != 'skipped' || steps.owner_entry.outcome != 'skipped')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hon-connected-student-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hon-crm-results/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
      - name: Check tracked source unchanged
        if: always()
        run: git diff --exit-code
