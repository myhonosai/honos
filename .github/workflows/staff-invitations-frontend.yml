name: Staff invitations frontend
on:
  pull_request:
    branches: [main, claude/staff-invitations]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/staff-invitations-frontend.yml'
      - 'apps/web/src/components/staff-invitations/**'
      - 'apps/web/src/components/staff-role-admin.tsx'
      - 'apps/web/src/app/staff/team/invitations/**'
      - 'apps/web/src/app/account/staff-invitation/**'
      - 'apps/web/test/staff-invitations*'
      - 'apps/web/scripts/staff-invitations-verification.mjs'
      - 'apps/web/public/manus-routes.json'
      - 'apps/api/src/accounts/**'
      - 'apps/api/src/staff-roles/**'
      - 'apps/api/src/foundation/**'
      - 'packages/contracts/**'
      - 'packages/auth/**'
      - 'packages/database/migrations/**'
      - 'packages/database/migration-checksums.json'
      - 'infra/postgres/**'
permissions:
  contents: read
concurrency:
  group: staff-invitations-frontend-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  frontend:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Frontend tests, typecheck, build and migration validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace
      - run: pnpm --filter @hon/web test
      - run: pnpm --filter @hon/web check && pnpm --filter @hon/web build && pnpm db:check
      - run: git diff --exit-code
  signed-api-browser:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Signed-session staff API, disposable database and mounted browser
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build && pnpm --filter @hon/web build
      - name: Prepare pinned browser tools and only the marked disposable fixture
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          echo "HON_STAFF_INVITATIONS_CHROME=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_STAFF_INVITATIONS_TOOLS=$RUNNER_TEMP/hon-staff-tools" >> "$GITHUB_ENV"
          echo "HON_STAFF_INVITATIONS_RESULTS=$RUNNER_TEMP/hon-staff-results" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hon-staff-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do pg_isready -h /var/run/postgresql -p 5432 && break; sleep 1; done
          pg_isready -h /var/run/postgresql -p 5432
          fixture_dir=/home/ubuntu/jobs/staff_frontend_verification
          sudo mkdir -p "$fixture_dir"
          sudo chown "$(id -u):$(id -g)" /home/ubuntu /home/ubuntu/jobs "$fixture_dir"
          chmod 700 "$fixture_dir"
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_CHAMPIONS_VALIDATION_TARGET=postgresql://localhost:5432/hon_champions_validation HON_CHAMPIONS_ENV_FILE="$fixture_dir/staff.env" node packages/database/scripts/setup-champions-club-validation.mjs
      - name: Existing exact-backend staff account authorization proof
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 bash -c 'set -a; . "$1"; set +a; node packages/database/scripts/test-school-staff-invitations-integrity.mjs' _ /home/ubuntu/jobs/staff_frontend_verification/staff.env
      - name: Actual frontend transport, Next, signed API/database and browser accessibility
        run: |
          set -euo pipefail
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted HON_STAFF_INVITATIONS_TEST=1 HON_STAFF_INVITATIONS_SHA="${{ github.event.pull_request.head.sha }}" HON_STAFF_INVITATIONS_RESULTS="$HON_STAFF_INVITATIONS_RESULTS" HON_STAFF_INVITATIONS_TOOLS="$HON_STAFF_INVITATIONS_TOOLS" HON_STAFF_INVITATIONS_CHROME="$HON_STAFF_INVITATIONS_CHROME" bash -c 'set -a; . "$1"; set +a; node apps/web/scripts/staff-invitations-verification.mjs' _ /home/ubuntu/jobs/staff_frontend_verification/staff.env
      - name: Retain private synthetic review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hon-staff-invitations-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hon-staff-results/
          retention-days: 3
          if-no-files-found: warn
      - name: Remove ephemeral credential descriptor
        if: always()
        run: rm -f /home/ubuntu/jobs/staff_frontend_verification/staff.env
      - run: git diff --exit-code
