name: Integration foundation verification (no providers)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/api/src/integrations/**'
      - 'apps/api/test/zernio-integration.test.cjs'
      - 'apps/web/src/app/hq/integrations/**'
      - 'apps/web/src/components/zernio-integration/**'
      - 'apps/web/test/zernio-integration.test.tsx'
      - 'apps/web/scripts/zernio-browser.mjs'
      - 'apps/api/scripts/zernio-api-verification.cjs'
      - 'packages/contracts/src/zernio-integration.ts'
      - 'packages/design-system/src/localization/zernio.ts'
      - 'scripts/configure-zernio*'
      - '.github/workflows/integration-foundation-validation.yml'
permissions:
  contents: read
concurrency:
  group: integration-foundation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - run: node --test .github/scripts/verify-node-runtime.test.mjs scripts/configure-zernio.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: pnpm db:check
      - run: git diff --exit-code


  database:
    name: Disposable PostgreSQL security proofs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    # Full canonical suite includes the exhaustive lock-order audit plus B1.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Require a patched Node.js runtime (October 2026 security release)
        run: node .github/scripts/verify-node-runtime.mjs --expect 22.23.4
      - name: Install dependencies (lockfile only)
        run: pnpm install --frozen-lockfile
      - name: Build packages used by the proofs
        run: pnpm prepare:workspace && pnpm --filter @hon/api build
      - name: Start the runner's preinstalled local PostgreSQL (disposable, localhost only)
        run: |
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do pg_isready -h /var/run/postgresql -p 5432 && break; sleep 1; done
          pg_isready -h /var/run/postgresql -p 5432
          sudo -u postgres psql -X -tAc "SELECT version()"
      - name: Run guarded disposable-database proofs
        run: .github/scripts/run-db-proofs.sh


  api-database:
    name: Zernio signed-session API and actual HQ resolver
    if: github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Build unchanged backend and frontend transport dependencies
        run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/api build
      - name: Run real frontend transport against isolated signed-session API and marked database
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DATABASE_URL:-}"
          test -z "${HON_RUNTIME_DATABASE_URL:-}"
          sudo systemctl start postgresql.service
          pg_isready -h /var/run/postgresql -p 5432
          zernio_job=/home/ubuntu/jobs/zernio_api
          sudo mkdir -p "$zernio_job"
          sudo chown "$(id -u):$(id -g)" /home/ubuntu /home/ubuntu/jobs "$zernio_job"
          chmod 700 "$zernio_job"
          test ! -e "$zernio_job/fixture.env"
          trap 'rm -f "$zernio_job/fixture.env"' EXIT
          env -i "PATH=$PATH" "HOME=$HOME" LANG=C.UTF-8 HON_CHAMPIONS_VALIDATION_TARGET=postgresql://localhost:5432/hon_champions_validation "HON_CHAMPIONS_ENV_FILE=$zernio_job/fixture.env" node packages/database/scripts/setup-champions-club-validation.mjs
          env -i "PATH=$PATH" "HOME=$HOME" LANG=C.UTF-8 bash -c 'set -a; . "$1"; set +a; HON_ZERNIO_API_TEST=1 node apps/api/scripts/zernio-api-verification.cjs' _ "$zernio_job/fixture.env"
      - name: Check tracked source unchanged
        if: always()
        run: git diff --exit-code


  browser:
    if: github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HON_API_BASE_URL: 'http://127.0.0.1:3001'
      HON_HQ_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Install unchanged lockfile and build application
        run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/web build
      - name: Zernio lifecycle, HTTP and localization regressions
        run: pnpm --filter @hon/web exec vitest run test/zernio-integration.test.tsx test/language-preference-http.test.ts test/localization.test.tsx
      - name: Diagnose and provision Korean browser fonts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hon-zernio-results"
          fc-list ':lang=ko' family | sort -u > "$RUNNER_TEMP/hon-zernio-results/korean-fonts-before.txt"
          if ! fc-list ':lang=ko' family | grep -q 'Noto Sans CJK KR'; then
            # Scope font provisioning to the official HTTPS Ubuntu archive. Keep package/TLS
            # signature verification; leave the runner's system repository configuration intact.
            font_sources="$RUNNER_TEMP/hon-fonts.list"
            echo 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main' > "$font_sources"
            font_options=(-o "Dir::Etc::sourcelist=$font_sources" -o 'Dir::Etc::sourceparts=-' -o Acquire::Retries=0 -o Acquire::https::Timeout=30)
            timeout 120s sudo apt-get "${font_options[@]}" update
            timeout 120s sudo apt-get "${font_options[@]}" install -y --no-install-recommends fonts-noto-cjk
            timeout 30s fc-cache -f
          fi
          fc-list ':lang=ko' family | sort -u > "$RUNNER_TEMP/hon-zernio-results/korean-fonts-after.txt"
          grep 'Noto Sans CJK KR' "$RUNNER_TEMP/hon-zernio-results/korean-fonts-after.txt"
          dpkg-query -W fonts-noto-cjk > "$RUNNER_TEMP/hon-zernio-results/korean-font-package.txt"
      - name: Prepare pinned browser tools outside the workspace
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          echo "HON_HQ_CHROME_BIN=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_HQ_BROWSER_TOOLS=$RUNNER_TEMP/hon-zernio-tools" >> "$GITHUB_ENV"
          echo "HON_HQ_BROWSER_RESULTS=$RUNNER_TEMP/hon-zernio-results" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hon-zernio-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3 esbuild@0.25.12
      - name: Actual application with signed synthetic contract fixtures
        id: browser
        run: pnpm --filter @hon/web exec node scripts/zernio-browser.mjs
      - name: Retain private screenshots and sanitized browser report
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hon-zernio-privacy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hon-zernio-results/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
      - name: Check tracked files unchanged
        if: always()
        run: git diff --exit-code
