name: Connected Adult CRM Browser
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/crm-adult-frontend-verification.yml'
      - 'apps/web/src/components/crm-lead-close-*'
      - 'apps/web/test/crm-close-*'
      - 'apps/web/test/crm-lead-close-*'
      - 'apps/web/scripts/crm-close-*'
      - 'apps/web/src/components/crm-adult-*'
      - 'apps/web/src/components/crm-family-*'
      - 'apps/web/src/components/crm-enrollment-*'
      - 'apps/web/test/crm-enrollment-discard*'
      - 'apps/web/test/crm-leads-page-session*'
      - 'apps/web/test/crm-enrollment-privacy*'
      - 'apps/web/src/app/staff/crm/leads/**'
      - 'apps/web/test/crm-family-*'
      - 'apps/web/scripts/crm-family-*'
      - 'apps/web/src/components/membership-plans/**'
      - 'apps/web/src/app/staff/billing/membership-plans/**'
      - 'apps/web/test/membership-plan-*'
      - 'apps/web/src/components/crm-leads-workbench.tsx'
      - 'apps/web/test/crm-adult-flow*'
      - 'apps/web/scripts/crm-adult-flow-browser.mjs'
      - 'apps/web/scripts/crm-recovery-api-verification.mjs'
permissions:
  contents: read
concurrency:
  group: crm-adult-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HON_API_BASE_URL: 'http://127.0.0.1:3001'
      HON_CRM_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install unchanged lockfile and build application
        run: pnpm install --frozen-lockfile && pnpm prepare:workspace && pnpm --filter @hon/web build
      - name: Focused frontend integration tests
        run: pnpm --filter @hon/web exec vitest run test/crm-leads-page-session.test.tsx test/crm-enrollment-discard.test.tsx test/crm-lead-create-ui.test.tsx test/crm-lead-close-ui.test.tsx test/crm-close-privacy.test.tsx test/crm-lead-close-http.test.ts test/crm-enrollment-privacy.test.ts test/crm-family-http.test.ts test/crm-family-flow.test.tsx test/membership-plan-http.test.ts test/membership-plan-ui.test.tsx test/crm-adult-flow-http.test.ts test/crm-adult-flow-ui.test.tsx test/crm-adult-flow-recovery.test.tsx test/crm-leads-workbench.test.tsx test/crm-lifecycle-handoff.test.tsx test/staff-route-auth-layout.test.ts
      - name: Frontend transport against the real API and guarded disposable PostgreSQL
        run: |
          set -euo pipefail
          pnpm --filter @hon/api build
          sudo systemctl start postgresql.service
          for _ in $(seq 1 30); do pg_isready -h /var/run/postgresql -p 5432 && break; sleep 1; done
          pg_isready -h /var/run/postgresql -p 5432
          fixture_dir=/home/ubuntu/jobs/crm_resume_verification
          sudo mkdir -p "$fixture_dir"
          sudo chown "$(id -u):$(id -g)" /home/ubuntu /home/ubuntu/jobs "$fixture_dir"
          chmod 700 "$fixture_dir"
          trap 'rm -f "$fixture_dir/recovery.env"' EXIT
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_FLEXIBLE_BILLING_ACCOUNTS_VALIDATION_TARGET=postgresql://localhost:5432/hon_flexible_billing_accounts_validation HON_FLEXIBLE_BILLING_ACCOUNTS_ENV_FILE="$fixture_dir/recovery.env" node packages/database/scripts/setup-flexible-billing-accounts-validation.mjs
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 HON_CRM_API_TEST=1 bash -c 'set -a; . "$1"; set +a; node apps/web/scripts/crm-recovery-api-verification.mjs && node apps/web/scripts/crm-family-api-verification.mjs' _ "$fixture_dir/recovery.env"
      - name: Prepare pinned browser tools outside the repository
        run: |
          set -euo pipefail
          chrome_bin="$(command -v google-chrome || command -v chromium || true)"
          test -n "$chrome_bin"
          echo "HON_CRM_CHROME=$chrome_bin" >> "$GITHUB_ENV"
          echo "HON_CRM_TOOLS=$RUNNER_TEMP/hon-crm-tools" >> "$GITHUB_ENV"
          echo "HON_CRM_RESULTS=$RUNNER_TEMP/hon-crm-results" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/hon-crm-tools" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1 axe-core@4.10.3
      - name: Actual application browser verification
        id: browser
        run: pnpm --filter @hon/web exec node scripts/crm-adult-flow-browser.mjs
      - name: Retain private review artifacts
        if: always() && steps.browser.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hon-crm-adult-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hon-crm-results/
          retention-days: 3
          if-no-files-found: warn
          include-hidden-files: false
      - name: Check tracked source unchanged
        if: always()
        run: git diff --exit-code
